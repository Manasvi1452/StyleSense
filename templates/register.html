<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">StyleSense+</div>
        <nav class="topbar-nav">
            <a href="/login">Login</a>
        </nav>
    </div>
</header>

<div class="auth-hero" aria-hidden="true"></div>

<main class="shell">
    <div class="page-head">
        <h1 class="page-title">Create Account</h1>
        <p class="page-subtitle">Set Up Your Personal Styling Profile</p>
    </div>

    <div class="auth-grid">
        <section class="card">
            <h2>What You Get</h2>
            <div class="auth-points">
                <div class="point">Context-aware recommendations for every event</div>
                <div class="point">Fast compare between ethnic and western looks</div>
                <div class="point">Direct shopping links for execution</div>
            </div>
            <div class="reference-panel" aria-hidden="true">
                <div class="ref-topbar"></div>
                <div class="ref-grid">
                    <div class="ref-block ref-brand"></div>
                    <div class="ref-block ref-soft"></div>
                    <div class="ref-block ref-line"></div>
                    <div class="ref-block ref-ink"></div>
                </div>
                <div class="media-caption">Smart Styling Preview</div>
            </div>
        </section>

        <section class="card">
            <h2>Registration</h2>
            <form method="POST">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="Choose username" required>

                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Create password" required>

                <button class="btn-full" type="submit">Register</button>
            </form>
            <p class="top-gap"><a href="/login">Already have an account? Login</a></p>
        </section>
    </div>
</main>

</body>
</html>
