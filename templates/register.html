<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="fashion-bg" aria-hidden="true">
    <span class="float-item item-1"></span>
    <span class="float-item item-2"></span>
    <span class="float-item item-3"></span>
    <span class="float-item item-4"></span>
    <span class="float-item item-5"></span>
</div>

<div class="site-title">StyleSense+</div>
<p class="site-tagline">Create your style profile in seconds.</p>

<div class="auth-shell">
    <div class="card">
        <h2>Register</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p class="top-gap"><a href="/login">Already have an account? Login</a></p>
    </div>
</div>
</body>
</html>
