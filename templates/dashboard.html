<!DOCTYPE html>
<html>
<head>
    <title>StyleSense+ Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #FAF8FF;
            margin: 0;
            padding: 0;
        }

        .site-title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #7B4AE2;
            margin-top: 30px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(123, 74, 226, 0.15);
        }

        label {
            font-weight: bold;
            color: #7B4AE2;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            background: #C8A2FF;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: #4B2E83;
            transition: 0.3s;
            margin-right: 10px;
        }

        button:hover {
            background: #7B4AE2;
            color: white;
        }

        .voice-button-wrapper {
            text-align: center;
            margin-bottom: 25px;
        }

        #recordingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(200,162,255,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .overlay-content {
            text-align: center;
            color: white;
        }

        .pulse-circle {
            width: 140px;
            height: 140px;
            background: #7B4AE2;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin: auto;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        .overlay-buttons {
            margin-top: 25px;
        }

    </style>
</head>

<body>

<div class="site-title">💜 StyleSense+</div>

<div class="container">
    <div class="card">

        <div class="voice-button-wrapper">
            <button type="button" onclick="startListening()">
                🎤 Speak Preferences
            </button>
        </div>

        <form method="POST" action="/analyze" enctype="multipart/form-data">

            <label>Upload Your Image</label>
            <input type="file" name="image" required>

            <label>Gender</label>
            <select name="gender" id="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Occasion</label>
            <select name="occasion" id="occasion" required>
                <option value="Casual">Casual</option>
                <option value="Office">Office</option>
                <option value="Party">Party</option>
                <option value="Wedding">Wedding</option>
            </select>

            <label>Mood</label>
            <input type="text" id="mood" name="mood"
                   placeholder="Describe your vibe or use voice" required>

            <label>Weather</label>
            <select name="weather" id="weather" required>
                <option value="Hot">Hot</option>
                <option value="Cold">Cold</option>
                <option value="Rainy">Rainy</option>
            </select>

            <label>Budget</label>
            <select name="budget" id="budget" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <br><br>
            <button type="submit">✨ Get Recommendations</button>
        </form>

    </div>
</div>

<div id="recordingOverlay">
    <div class="overlay-content">
        <div class="pulse-circle"></div>
        <h2>Listening...</h2>
        <div class="overlay-buttons">
            <button onclick="stopListening()">Stop</button>
            <button onclick="cancelListening()">Cancel</button>
        </div>
    </div>
</div>

<script>

let recognition;

function startListening() {

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-IN";

    recognition.start();
    document.getElementById("recordingOverlay").style.display = "flex";

    recognition.onresult = function(event) {

        const transcript = event.results[0][0].transcript.toLowerCase();
        console.log("Transcript:", transcript);

        analyzeSpeech(transcript);

        stopListening();
    };

    recognition.onend = function() {
        stopListening();
    };
}

/* ---------------- SMART ANALYZER ---------------- */

function analyzeSpeech(text) {

    // Always fill mood with full text
    document.getElementById("mood").value = text;

    /* ----------- GENDER ----------- */
    const genderMap = {
        "female": ["female", "woman", "girl", "lady"],
        "male": ["male", "man", "boy", "gentleman"]
    };

    setFieldFromKeywords("gender", genderMap, text, {
        "female": "Female",
        "male": "Male"
    });

    /* ----------- OCCASION ----------- */
    const occasionMap = {
        "Wedding": ["wedding", "marriage", "bride"],
        "Party": ["party", "birthday", "celebration"],
        "Office": ["office", "work", "formal"],
        "Casual": ["casual", "daily", "normal"]
    };

    setFieldFromKeywords("occasion", occasionMap, text);

    /* ----------- WEATHER ----------- */
    const weatherMap = {
        "Cold": ["cold", "winter", "chilly"],
        "Rainy": ["rain", "rainy", "monsoon"],
        "Hot": ["hot", "summer", "sunny"]
    };

    setFieldFromKeywords("weather", weatherMap, text);

    /* ----------- BUDGET ----------- */
    const budgetMap = {
        "Low": ["low budget", "cheap", "affordable", "budget friendly"],
        "Medium": ["medium budget", "mid range", "moderate"],
        "High": ["high budget", "premium", "expensive", "luxury"]
    };

    setFieldFromKeywords("budget", budgetMap, text);
}

/* -------------- Helper Function -------------- */

function setFieldFromKeywords(fieldId, map, text, valueMap = null) {

    for (const key in map) {
        const keywords = map[key];

        for (let keyword of keywords) {
            if (text.includes(keyword)) {

                if (valueMap) {
                    document.getElementById(fieldId).value = valueMap[key];
                } else {
                    document.getElementById(fieldId).value = key;
                }

                return; // Stop after first match
            }
        }
    }
}

/* ---------------- Controls ---------------- */

function stopListening() {
    if (recognition) recognition.stop();
    document.getElementById("recordingOverlay").style.display = "none";
}

function cancelListening() {
    if (recognition) recognition.abort();
    document.getElementById("recordingOverlay").style.display = "none";
}

</script>


</body>
</html>
