<!DOCTYPE html>
<html>
<head>
    <title>StyleSense+ Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #FAF8FF;
            margin: 0;
            padding: 0;
        }

        .site-title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #7B4AE2;
            margin-top: 30px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(123, 74, 226, 0.15);
        }

        label {
            font-weight: bold;
            color: #7B4AE2;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            background: #C8A2FF;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: #4B2E83;
            transition: 0.3s;
            margin-right: 10px;
        }

        button:hover {
            background: #7B4AE2;
            color: white;
        }

        .voice-button-wrapper {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Overlay */

        #recordingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(200,162,255,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .overlay-content {
            text-align: center;
            color: white;
        }

        .pulse-circle {
            width: 140px;
            height: 140px;
            background: #7B4AE2;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin: auto;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        .overlay-buttons {
            margin-top: 25px;
        }

    </style>
</head>

<body>

<div class="site-title">💜 StyleSense+</div>

<div class="container">
    <div class="card">

        <!-- 🎤 VOICE BUTTON MOVED TO TOP -->
        <div class="voice-button-wrapper">
            <button type="button" onclick="startListening()">
                🎤 Speak Preferences
            </button>
        </div>

        <form method="POST" action="/analyze" enctype="multipart/form-data">

            <label>Upload Your Image</label>
            <input type="file" name="image" required>

            <label>Gender</label>
            <select name="gender" id="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Occasion</label>
            <select name="occasion" id="occasion" required>
                <option value="Casual">Casual</option>
                <option value="Office">Office</option>
                <option value="Party">Party</option>
                <option value="Wedding">Wedding</option>
            </select>

            <label>Mood</label>
            <input type="text" id="mood" name="mood"
                   placeholder="Describe your vibe or use voice" required>

            <label>Weather</label>
            <select name="weather" id="weather" required>
                <option value="Hot">Hot</option>
                <option value="Cold">Cold</option>
                <option value="Rainy">Rainy</option>
            </select>

            <label>Budget</label>
            <select name="budget" id="budget" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <br><br>
            <button type="submit">✨ Get Recommendations</button>
        </form>

    </div>
</div>

<!-- Recording Overlay -->
<div id="recordingOverlay">
    <div class="overlay-content">
        <div class="pulse-circle"></div>
        <h2>Listening...</h2>

        <div class="overlay-buttons">
            <button onclick="stopListening()">Stop</button>
            <button onclick="cancelListening()">Cancel</button>
        </div>
    </div>
</div>

<script>

let recognition;

function startListening() {

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-IN";

    recognition.start();

    document.getElementById("recordingOverlay").style.display = "flex";

    recognition.onresult = function(event) {

        const transcript = event.results[0][0].transcript.toLowerCase();

        document.getElementById("mood").value = transcript;

        if (transcript.includes("female") || transcript.includes("woman"))
            document.getElementById("gender").value = "Female";

        if (transcript.includes("male") || transcript.includes("man"))
            document.getElementById("gender").value = "Male";

        if (transcript.includes("wedding"))
            document.getElementById("occasion").value = "Wedding";

        if (transcript.includes("party"))
            document.getElementById("occasion").value = "Party";

        if (transcript.includes("office"))
            document.getElementById("occasion").value = "Office";

        if (transcript.includes("cold"))
            document.getElementById("weather").value = "Cold";

        if (transcript.includes("rain"))
            document.getElementById("weather").value = "Rainy";

        if (transcript.includes("hot"))
            document.getElementById("weather").value = "Hot";

        if (transcript.includes("low"))
            document.getElementById("budget").value = "Low";

        if (transcript.includes("medium"))
            document.getElementById("budget").value = "Medium";

        if (transcript.includes("high"))
            document.getElementById("budget").value = "High";

        stopListening();
    };

    recognition.onend = function() {
        stopListening();
    };
}

function stopListening() {
    if (recognition) recognition.stop();
    document.getElementById("recordingOverlay").style.display = "none";
}

function cancelListening() {
    if (recognition) recognition.abort();
    document.getElementById("recordingOverlay").style.display = "none";
}

</script>

</body>
</html>
