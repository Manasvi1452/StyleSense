<!DOCTYPE html>
<html>
<head>
    <title>StyleSense+ Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #FAF8FF;
            margin: 0;
            padding: 0;
        }

        .site-title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #7B4AE2;
            margin-top: 30px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(123, 74, 226, 0.15);
        }

        label {
            font-weight: bold;
            color: #7B4AE2;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            background: #C8A2FF;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: #4B2E83;
            transition: 0.3s;
            margin-right: 10px;
        }

        button:hover {
            background: #7B4AE2;
            color: white;
        }

        /* CAMERA */

        .camera-wrapper {
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
        }

        #video {
            width: 100%;
        }

        #flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
        }

        .flash-animation {
            animation: flashEffect 0.4s ease;
        }

        @keyframes flashEffect {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        #canvas {
            width: 100%;
            display: none;
            border-radius: 15px;
        }

        /* VOICE OVERLAY */

        #recordingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(200,162,255,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .overlay-content {
            text-align: center;
            color: white;
        }

        .pulse-circle {
            width: 140px;
            height: 140px;
            background: #7B4AE2;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin: auto;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

    </style>
</head>

<body>

<div class="site-title">💜 StyleSense+</div>

<div class="container">
<div class="card">

<!-- VOICE BUTTON -->
<div style="text-align:center; margin-bottom:20px;">
    <button type="button" onclick="startListening()">🎤 Speak Preferences</button>
</div>

<form method="POST" action="/analyze" enctype="multipart/form-data">

<label>Capture or Upload Image</label>

<!-- CAMERA -->
<div class="camera-wrapper">
    <video id="video" autoplay muted></video>
    <div id="flash"></div>
</div>

<canvas id="canvas"></canvas>

<br>

<button type="button" onclick="captureImage()">📸 Capture</button>
<button type="button" onclick="retakeImage()" id="retakeBtn" style="display:none;">🔄 Retake</button>

<input type="hidden" name="captured_image" id="captured_image">

<br><br>

<div style="text-align:center; font-weight:bold; color:#7B4AE2;">OR</div>

<br>

<input type="file" name="uploaded_image" accept="image/*">

<label>Gender</label>
<select name="gender" id="gender" required>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>

<label>Occasion</label>
<select name="occasion" id="occasion" required>
    <option value="Casual">Casual</option>
    <option value="Office">Office</option>
    <option value="Party">Party</option>
    <option value="Wedding">Wedding</option>
</select>

<label>Mood</label>
<input type="text" id="mood" name="mood" required>

<label>Weather</label>
<select name="weather" id="weather" required>
    <option value="Hot">Hot</option>
    <option value="Cold">Cold</option>
    <option value="Rainy">Rainy</option>
</select>

<label>Budget</label>
<select name="budget" id="budget" required>
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
</select>

<br><br>
<button type="submit">✨ Get Recommendations</button>

</form>
</div>
</div>

<!-- VOICE OVERLAY -->
<div id="recordingOverlay">
    <div class="overlay-content">
        <div class="pulse-circle"></div>
        <h2>Listening...</h2>
        <button onclick="stopListening()">Stop</button>
    </div>
</div>

<script>

/* ---------------- CAMERA ---------------- */

let videoStream;

document.addEventListener("DOMContentLoaded", function() {
    startCamera();
});

function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            videoStream = stream;
            document.getElementById("video").srcObject = stream;
        })
        .catch(() => alert("Camera access denied."));
}

function captureImage() {

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    const imageData = canvas.toDataURL("image/jpeg");
    document.getElementById("captured_image").value = imageData;

    const flash = document.getElementById("flash");
    flash.classList.add("flash-animation");
    setTimeout(() => flash.classList.remove("flash-animation"), 400);

    videoStream.getTracks().forEach(track => track.stop());

    video.style.display = "none";
    canvas.style.display = "block";
    document.getElementById("retakeBtn").style.display = "inline-block";
}

function retakeImage() {
    document.getElementById("video").style.display = "block";
    document.getElementById("canvas").style.display = "none";
    document.getElementById("retakeBtn").style.display = "none";
    startCamera();
}

/* ---------------- VOICE ---------------- */

let recognition;

function startListening() {

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-IN";
    recognition.start();

    document.getElementById("recordingOverlay").style.display = "flex";

    recognition.onresult = function(event) {

        const transcript = event.results[0][0].transcript.toLowerCase();
        document.getElementById("mood").value = transcript;

        if (transcript.includes("female") || transcript.includes("girl"))
            document.getElementById("gender").value = "Female";

        if (transcript.includes("male") || transcript.includes("boy"))
            document.getElementById("gender").value = "Male";

        if (transcript.includes("wedding"))
            document.getElementById("occasion").value = "Wedding";

        if (transcript.includes("party"))
            document.getElementById("occasion").value = "Party";

        if (transcript.includes("office"))
            document.getElementById("occasion").value = "Office";

        if (transcript.includes("cold") || transcript.includes("winter"))
            document.getElementById("weather").value = "Cold";

        if (transcript.includes("rain"))
            document.getElementById("weather").value = "Rainy";

        if (transcript.includes("hot") || transcript.includes("summer"))
            document.getElementById("weather").value = "Hot";

        if (transcript.includes("low"))
            document.getElementById("budget").value = "Low";

        if (transcript.includes("medium"))
            document.getElementById("budget").value = "Medium";

        if (transcript.includes("high"))
            document.getElementById("budget").value = "High";

        stopListening();
    };

    recognition.onend = function() {
        stopListening();
    };
}

function stopListening() {
    if (recognition) recognition.stop();
    document.getElementById("recordingOverlay").style.display = "none";
}

</script>

</body>
</html>
